sites:
  - name: "ARD"
    url: "https://www.ardmediathek.de/filme"
    title: "Die besten Filme in der ARD"
    description: "Die Filme der ARD im Überblick: Von Krimis, Komödien, Arthouse- und Liebesfilmen bis zu Märchen und spannenden Debütfilmen."
    selector:
      item: "div[itemType='https://schema.org/Movie']"
      link: "a[itemProp='url']::attr(href)"
      title: "h3::text"
      description: ""
      pagination: "a[href^='/filme-']::attr(href)"
  - name: "ZDF"
    url: "https://www.zdf.de/spielfilm-highlights-104"
    title: "ZDF Spielfilm-Highlights"
    description: "Internationale Filme mit spannenden und emotionalen Geschichten. Ob Krimi, Drama, Komödie, Lovestory oder Thriller, für jeden Geschmack wird etwas geboten."
    selector:
      item: "a[data-testid='teaser-tile'][href*='-movie-']"
      link: "::attr(href)"
      title: "h3::text"
      description: ""
      pagination: ""
  - name: "Arte"
    url: "https://www.arte.tv/de/videos/kino/filme/"
    title: "Arte Kinofilme"
    description: "Kultfilme, Autorenfilme, Stummfilme – Entdecken Sie die Vielfalt des ARTE-Filmangebots."
    selector:
      item: "li[data-testid='ts-tsItem']:has(h3[data-testid='ts-tsHvrTitle'])"
      link: "a::attr(href)"
      title: "h3[data-testid='ts-tsHvrTitle']::text"
      description: ""
      # ?page=1 liefert dieselbe Seite wie die Basis-URL
      pagination: "a[href*='?page=']:not([href$='page=1'])::attr(href)"
  - name: "Joyn"
    url: "https://www.joyn.de/filme"
    title: "Joyn Filme"
    description: "Filme kostenlos streamen auf Joyn: Die beliebtesten und neuesten Filme im Überblick."
    selector:
      # Joyn liefert nur die ersten Reihen im HTML aus, die weiteren lädt die Seite
      # erst per GraphQL nach. Hier ist also nur sichtbar, was die oberen Reihen zeigen.
      item: "a[data-testid='LL--movie']"
      link: "::attr(href)"
      title: "h3::text"
      description: ""
      pagination: ""
  - name: "JustWatch"
    url: "https://www.justwatch.com/de/justwatch-tv"
    title: "JustWatch TV kostenlose Filme"
    description: "Kostenlose Filme auf JustWatch TV."
    selector:
      # Das Poster trägt ein Tag: "Kostenlos" als Text bei freien Filmen, ein
      # Einkaufstaschen-Icon bei Leihfilmen. Die Reihe "Top 10 kostenlose Titel"
      # hat gar kein Tag, sie wird deshalb über ihre Überschrift mitgenommen.
      item: "a[href*='/Film/']:has(span.title-poster__free-tag:not(:has(img))), div.classic-module:has(div.headline:contains('Top 10 kostenlose')) a[href*='/Film/']"
      link: "::attr(href)"
      title: "img::attr(alt)"
      description: ""
      pagination: ""
  - name: "Pluto"
    url: "https://pluto.tv/gsa/movies/"
    title: "Pluto TV Filme"
    description: "Kostenlose Filme auf Pluto TV."
    selector:
      item: "a[data-testid='region-link'][href^='/gsa/movies/']:not([href*='/category/'])"
      link: "::attr(href)"
      title: "::attr(aria-label)"
      description: ""
      pagination: ""
  - name: "Tele5"
    url: "https://tele5.de/filme"
    title: "Filme bei TELE 5"
    description: "Filme aus der TELE 5 Mediathek."
    format: "json-ld"
  - name: "Rakuten"
    url: "https://gizmo.rakuten.tv/v3/lists/free-recently-added-ab99bc50-a693-4e8a-856c-a93282416e7a?classification_id=307&device_identifier=web&device_stream_audio_quality=2.0&device_stream_hdr_type=NONE&device_stream_video_quality=FHD&locale=de&market_code=de&contents%5Bper_page%5D=48"
    title: "Rakuten TV: Neue kostenlose Filme"
    description: "Neu hinzugefügte kostenlose Filme auf Rakuten TV."
    format: "json"
    selector:
      item: "data.contents.data"
      link: "https://www.rakuten.tv/de/movies/{id}"
      title: "title"
      description: ""
      pagination: ""
